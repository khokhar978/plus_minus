plugins {
    id 'com.android.application'
}

android {
    namespace 'com.khokhar.plusminus'
    compileSdk 34

    defaultConfig {
        applicationId "com.khokhar.plusminus"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            java.srcDirs += ['../../Server/src/main/java']
        }
    }
}

dependencies {
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Server dependencies
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.slf4j:slf4j-simple:1.7.36'
    
    // NanoHTTPD for serving React
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    
    // ZXing for QR Code
    implementation 'com.google.zxing:core:3.5.2'
}

tasks.register("buildReactApp", Exec) {
    workingDir = file("../../Client")
    
    inputs.dir(file("../../Client/src"))
    inputs.dir(file("../../Client/public"))
    inputs.file(file("../../Client/package.json"))
    inputs.file(file("../../Client/vite.config.js"))
    outputs.dir(file("../../Client/dist"))
    
    if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
        commandLine 'cmd', '/c', 'npm install && npm run build'
    } else {
        commandLine 'sh', '-c', 'npm install && npm run build'
    }
}

tasks.register("copyReactDist", Copy) {
    dependsOn "buildReactApp"
    from file("../../Client/dist")
    into file("src/main/assets")
    inputs.dir(file("../../Client/dist"))
    outputs.dir(file("src/main/assets"))
}

preBuild.dependsOn("copyReactDist")
